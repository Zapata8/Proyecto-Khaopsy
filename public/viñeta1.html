<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cómic digital interactivo</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="cont">

        <!-- Botón audio con imagen -->
        <button class="btn-audio-img" onclick="reproducirAudio()" type="button">
            <img src="/assets/boton.png" alt="Reproducir audio">
        </button>

        <!-- Audio de esta viñeta -->
        <audio id="audioComic">
            <source src="img/1.mp3" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>

        <!-- Animaciones Lottie con brillo interactivo -->
        <div id="sol" class="interactivo"></div> 
        <div id="kael" class="interactivo"></div>
        <div id="torre" class="interactivo"></div>
        <div id="chaqueta" class="interactivo"></div>

        <!-- Cuadro interactivo -->
        <div id="cuadro" class="interactivo">
            <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 80.5 97.8">
                <defs>
                    <style>
                        .cls-1 {
                            fill: #c2c1c1;
                            filter: url(#drop-shadow-4);
                        }

                        .cls-1, .cls-2, .cls-3, .cls-4 {
                            stroke-width: 0px;
                        }

                        .cls-2 {
                            fill: #6a1f0b;
                            filter: url(#drop-shadow-2);
                        }

                        .cls-3 {
                            fill: #8e2913;
                            filter: url(#drop-shadow-3);
                        }

                        .cls-4 {
                            fill: #000;
                            filter: url(#drop-shadow-1);
                        }
                    </style>

                    <filter id="drop-shadow-1" filterUnits="userSpaceOnUse">
                        <feOffset dx="6.1" dy="11.5"/>
                        <feGaussianBlur result="blur" stdDeviation="0"/>
                        <feFlood flood-color="#010101" flood-opacity=".9"/>
                        <feComposite in2="blur" operator="in"/>
                        <feComposite in="SourceGraphic"/>
                    </filter>

                    <filter id="drop-shadow-2" filterUnits="userSpaceOnUse">
                        <feOffset dx="6.1" dy="11.5"/>
                        <feGaussianBlur result="blur-2" stdDeviation="0"/>
                        <feFlood flood-color="#010101" flood-opacity=".9"/>
                        <feComposite in2="blur-2" operator="in"/>
                        <feComposite in="SourceGraphic"/>
                    </filter>

                    <filter id="drop-shadow-3" filterUnits="userSpaceOnUse">
                        <feOffset dx="6.1" dy="11.5"/>
                        <feGaussianBlur result="blur-3" stdDeviation="0"/>
                        <feFlood flood-color="#010101" flood-opacity=".9"/>
                        <feComposite in2="blur-3" operator="in"/>
                        <feComposite in="SourceGraphic"/>
                    </filter>

                    <filter id="drop-shadow-4" filterUnits="userSpaceOnUse">
                        <feOffset dx="6.1" dy="11.5"/>
                        <feGaussianBlur result="blur-4" stdDeviation="0"/>
                        <feFlood flood-color="#010101" flood-opacity=".9"/>
                        <feComposite in2="blur-4" operator="in"/>
                        <feComposite in="SourceGraphic"/>
                    </filter>
                </defs>

                <g id="b1">
                    <path class="cls-4" d="M68.3,7.4c1.1.3,2.2.7,3.3,1v76.7l-4,.7c.2-26.1.5-52.2.7-78.3Z"/>
                </g>

                <g id="b2">
                    <path class="cls-2" d="M68.6,85.8c-22.3-2.8-44.5-5.5-66.8-8.3C2.4,52.3,3.1,27.2,3.7,2c21.8,1.8,43.7,3.6,65.5,5.4-.2,26.1-.5,52.2-.7,78.3Z"/>
                </g>

                <g id="b3">
                    <path class="cls-3" d="M63.2,79c-18-2-36-4.1-54-6.1V10.1c18,1.1,36,2.3,54,3.4v65.5Z"/>
                </g>

                <g id="b4">
                    <path class="cls-1" d="M51.7,61.4c-9.7-.7-19.4-1.4-29-2V27c9.7.9,19.4,1.8,29,2.7v31.7Z"/>
                </g>
            </svg>
        </div>

    </div>

    <!-- Librería Lottie -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>

    <script>
        const kael = lottie.loadAnimation({
            container: document.getElementById('kael'),
            renderer: 'svg',
            loop: false,
            autoplay: false,
            path: 'img/kael.json'
        });

        document.getElementById('kael').addEventListener('click', function () {
            kael.stop();
            kael.play();
        });

        const torre = lottie.loadAnimation({
            container: document.getElementById('torre'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'img/torre.json'
        });

        document.getElementById('torre').addEventListener('click', function () {
            torre.stop();
            torre.play();
        });

        const chaqueta = lottie.loadAnimation({
            container: document.getElementById('chaqueta'),
            renderer: 'svg',
            loop: false,
            autoplay: false,
            path: 'img/chaqueta.json'
        });

        document.getElementById('chaqueta').addEventListener('click', function () {
            chaqueta.stop();
            chaqueta.play();
        });

        const sol = lottie.loadAnimation({
            container: document.getElementById('sol'),
            renderer: 'svg',
            loop: false,
            autoplay: false,
            path: 'img/sol.json'
        });

        document.getElementById('sol').addEventListener('click', function () {
            sol.stop();
            sol.play();
        });

        // Interacción del cuadro
        document.getElementById('b1').addEventListener('click', function () {
            this.style.display = 'none';
        });

        document.getElementById('b2').addEventListener('click', function () {
            this.style.display = 'none';
        });

        document.getElementById('b3').addEventListener('click', function () {
            this.style.display = 'none';
        });

        document.getElementById('b4').addEventListener('click', function () {
            this.style.display = 'none';
        });

        // Reproducir / pausar audio con el botón de imagen
        function reproducirAudio() {
            const audio = document.getElementById("audioComic");

            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        // Ir a la siguiente viñeta
        function avanzar() {
            window.location.href = "viñeta2.html";
        }
    </script>

</body>
</html>
